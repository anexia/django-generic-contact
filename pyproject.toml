[build-system]
requires = ["setuptools>=75.1.0", "setuptools-scm>=8.1", "wheel>=0.44.0"]
build-backend = "setuptools.build_meta"

[project]
name = "django-generic-contact"
dynamic = ["version"]
description = "Django module to store contact request in a structured yet generic manner."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT License"}
authors = [
    {name = "Alexandra Bruckner", email = "abruckner@anexia-it.com"},
]
dependencies = [
    "django>=4.2,<6.1",
    "jsonschema>=4.23.0,<4.24",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Framework :: Django",
    "Framework :: Django :: 4.2",
    "Framework :: Django :: 5.2",
    "Framework :: Django :: 6.0",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

[project.optional-dependencies]
dev = [
    "build>=1.2.2,<1.3",
    "coverage>=7.6.2,<7.7",
    "pre-commit>=4.0.1,<4.2",
    "setuptools>=75.1.0,<76.2",
    "setuptools-scm>=8.1,<8.2",
    "twine>=5.1.1,<5.2",
    "wheel>=0.44.0,<0.45",
]

[project.urls]
Homepage = "https://github.com/anexia/django-generic-contact"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["django_generic_contact*"]

[tool.setuptools_scm]
