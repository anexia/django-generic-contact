name: Run linter and tests
on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - '3.10'
          - '3.11'
          - '3.12'
          - '3.13'
          - '3.14'
        django-version:
          - '4.2'
          - '5.2'
          - '6.0'
        exclude:
          - python-version: 3.13
            django-version: 4.2
          - python-version: 3.14
            django-version: 4.2
          - python-version: 3.10
            django-version: 6.0
          - python-version: 3.11
            django-version: 6.0

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies and package
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
          pip install django~=${{ matrix.django-version }}.0

      - name: Run lint and code review with isort and black
        run: |
          pre-commit run --all-files

      - name: Run tests with coverage
        run: |
          # prepare Django project: link all necessary data from the test project into the root directory
          # Hint: Simply changing the directory does not work (leads to missing files in coverage report)
          ln -s ./tests/core core
          ln -s ./tests/testapp testapp
          ln -s ./tests/manage.py manage.py

          # run tests with coverage
          coverage run \
            --source='./django_generic_contact' \
            manage.py test
          coverage xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
